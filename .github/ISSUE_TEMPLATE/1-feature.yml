name: 機能開発
description: エピックの子 Issue など、1つの関心事の機能追加・変更
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        1つの Issue は半日〜1日で終わる大きさにします。大きすぎるときはエピックにして分解してください。
        受入条件は「テストや画面で確かめられる文」で書きます。
  - type: input
    id: epic
    attributes:
      label: 親エピック
      description: エピックの子 Issue なら `Epic #番号` と書きます。エピックに属さない場合は「なし」
      placeholder: "Epic #<番号>"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 背景・目的
      description: なぜ必要か。関連するユースケース（docs/requirements.md の UC 番号）があれば書きます
      placeholder: |
        UC-<番号> <例：投稿へのいいね>。ほかの人の学習記録に気軽に反応できるようにする。
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: やること
      placeholder: |
        - <例：Like モデルと、いいね・取り消しのボタン>
        - <例：投稿一覧と詳細にいいねの数を表示する>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入条件
      description: 何ができれば完了か。レビュワーと PdM はこの項目で合否を判断します
      value: |
        - [ ] AC-1:
        - [ ] AC-2:
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: 今回やらないこと（別の Issue に回すもの）
      placeholder: "- <例：いいねした人の一覧表示（拡張）>"
  - type: textarea
    id: refs
    attributes:
      label: 参考
      description: 関係する仕様書・画面・Issue
      placeholder: |
        - 画面: docs/screens.md の S-<番号>
        - データ: docs/data-model.md の <例：likes>
  - type: checkboxes
    id: impact
    attributes:
      label: 影響範囲
      description: 当てはまるものにチェックします（レビューの観点を決めるのに使います）
      options:
        - label: 認証・認可・個人情報・シークレットに関わる
        - label: DB のテーブル・カラムを追加・変更する（マイグレーションあり）
        - label: 仕様書（docs/）の更新が必要
